name: Publish

# Publish a new version to crates.io. Releases are cut explicitly by pushing a
# SemVer tag (e.g. `v0.2.0`) that matches the version in Cargo.toml.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    # id-token: write lets GitHub issue an OIDC token that crates.io exchanges
    # for a short-lived publishing token (trusted publishing) — no long-lived
    # API token is stored in repository secrets.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "error: tag v${TAG} does not match crate version ${VERSION}" >&2
            exit 1
          fi

      - name: Dry run
        run: cargo publish --dry-run

      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
