# release-plz configuration.
#
# semver_check is temporarily disabled: cargo-semver-checks resolves the
# published baseline (metasearch 0.3.4), which is part of a cycle on
# crates.io — metasearch 0.3.4 -> search-tui ^0.1.3 -> search-tui 0.1.4 ->
# metasearch ^0.3 — so `cargo update` fails and every release-plz run errors
# out. Publishing the next metasearch version (with the unused search-tui
# dependency removed) breaks the cycle; after this release ships, this can be
# restored to `semver_check = true`.
[[package]]
name = "metadata-search-engine-rs"
semver_check = false
